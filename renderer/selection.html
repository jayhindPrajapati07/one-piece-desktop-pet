<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Choose Your Nakama</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: linear-gradient(135deg, #0d0d1a 0%, #0a1628 50%, #0f2040 100%);
      color:#fff;
      font-family:'Segoe UI','Helvetica Neue',sans-serif;
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      overflow:hidden;
    }

    header {
      padding: 18px 0 10px;
      text-align:center;
    }

    h1 {
      font-size:24px;
      background: linear-gradient(90deg, #f7c948, #ff6b35, #e74c3c);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      letter-spacing:1px;
      margin-bottom:4px;
    }

    p.sub {
      color:#888;
      font-size:12px;
    }

    .scroll-area {
      flex:1;
      overflow-y:auto;
      width:100%;
      padding: 10px 20px 20px;
    }

    .scroll-area::-webkit-scrollbar { width:4px; }
    .scroll-area::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

    .grid {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:12px;
    }

    .card {
      background:rgba(255,255,255,0.05);
      border:2px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:12px 8px 10px;
      cursor:pointer;
      text-align:center;
      transition: all 0.2s ease;
      position:relative;
    }

    .card:hover {
      border-color: var(--col);
      background: rgba(255,255,255,0.1);
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.4);
    }

    .card canvas { display:block; margin:0 auto 8px; border-radius:6px; }

    .card .name {
      font-size:12px;
      font-weight:700;
      color:#f0f0f0;
      line-height:1.2;
    }

    .card .role {
      font-size:10px;
      color:#888;
      margin-top:2px;
    }

    .card .badge {
      position:absolute;
      top:6px; right:6px;
      font-size:10px;
      background: var(--col);
      color:#000;
      padding:2px 5px;
      border-radius:4px;
      font-weight:800;
    }

    .card:hover .name { color: var(--col); }
  </style>
</head>
<body>
  <header>
    <h1>⚓ Choose Your Nakama ⚓</h1>
    <p class="sub">Straw Hat Pirates — pick your companion</p>
  </header>

  <div class="scroll-area">
    <div class="grid" id="grid"></div>
  </div>

  <script src="js/characters.js"></script>
  <script>
    const grid = document.getElementById('grid');

    CHARACTERS.forEach((char, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--col', char.color || '#f7c948');

      if (i === 0) {
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = '★';
        card.appendChild(badge);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 90; canvas.height = 110;
      card.appendChild(canvas);

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = char.name.split(' ').slice(-1)[0]; // last name / short
      card.appendChild(name);

      const role = document.createElement('div');
      role.className = 'role';
      role.textContent = char.role;
      card.appendChild(role);

      card.addEventListener('click', () => {
        window.electronAPI.selectCharacter({ id: char.id, name: char.name, role: char.role, color: char.color });
      });

      grid.appendChild(card);

      // Draw preview on mini canvas
      requestAnimationFrame(() => drawPreview(canvas, char));
    });

    function drawPreview(canvas, char) {
      const ctx = canvas.getContext('2d');
      // Scale to fit the preview canvas
      ctx.save();
      const scale = 0.48;
      ctx.scale(scale, scale);
      const fakeCy = canvas.height / scale / 2 + 10;

      const S = {
        cx: canvas.width / scale / 2,
        cy: fakeCy,
        emotion: 'idle',
        tick: 0,
        animOffset: 0,
        armL: 0.1,
        armR: -0.1,
        headTilt: 0,
        isBlinking: false,
      };

      char.draw(ctx, S);
      ctx.restore();
    }
  </script>
</body>
</html>
