name: Build & Release

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
          - os: windows-latest
            artifact: '*.exe'
          - os: ubuntu-latest
            artifact: '*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build -- --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist/

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "One Piece Desktop Pet ${{ github.ref_name }}" \
            --notes "## 🏴‍☠️ One Piece Desktop Pet ${{ github.ref_name }}

          ### Download for your platform
          | Platform | File |
          |----------|------|
          | 🍎 macOS | \`.dmg\` |
          | 🪟 Windows | \`.exe\` (NSIS installer) |
          | 🐧 Linux | \`.AppImage\` |

          ### Install
          - **macOS**: Open the \`.dmg\`, drag the app to Applications.
          - **Windows**: Run the \`.exe\` installer.
          - **Linux**: \`chmod +x *.AppImage && ./Desktop-Pet-*.AppImage\`

          > macOS blocked by Gatekeeper? → System Preferences → Security → Open Anyway"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
